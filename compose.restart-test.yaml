name: studio-restart-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studio
      MYSQL_USER: studio
      MYSQL_PASSWORD: restart_test_password
      MYSQL_ROOT_PASSWORD: restart_root_password
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -ustudio -p$$MYSQL_PASSWORD studio -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 40
  backend:
    image: material-studio-backend:restart-test
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/studio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: studio
      DB_PASSWORD: restart_test_password
      STORAGE_PATH: /data/files
      WORKER_THREADS: 1
      QUEUE_CAPACITY: 4
      SIMULATION_ENABLED: 'true'
    volumes:
      - files:/data/files
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      timeout: 3s
      start_period: 15s
      retries: 30
  frontend:
    image: material-studio-frontend:restart-test
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
  checks:
    image: node:22-bookworm-slim
    profiles: [tools]
    volumes:
      - ./infra:/qa:ro
      - checkpoint:/state
    entrypoint: [node, /qa/restart-smoke.mjs]
volumes:
  database:
  files:
  checkpoint:
